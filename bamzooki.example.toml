# Copy to `bamzooki.toml` (gitignored) and edit, or point BAMZOOKI_CONFIG at another file.
# Every path may also be overridden by an environment variable (shown next to each key).
# Leave a key out to use auto-discovery.

# Root of the BAMZOOKi install (contains Bonsai.exe and he.skx).       BAMZOOKI_INSTALL
# install_dir = "C:/Program Files (x86)/BAMZOOKi"

# Per-user save root the engine writes to (Teams/, Contests/, ...).   BAMZOOKI_SAVE_DIR
# Windows default: %APPDATA%/Bamzooki
# save_dir = "C:/Users/me/AppData/Roaming/Bamzooki"

# Command prefix used to launch Bonsai.exe on Linux/macOS.            BAMZOOKI_WINE
# Unset on Windows. Example: ["wine"] or ["env", "WINEPREFIX=/home/me/.wine-bamzooki", "wine"]
# wine_command = ["wine"]

# Where decrypted scripts, decoded Zooks and the install sandbox go.  BAMZOOKI_CACHE_DIR
# Relative paths are resolved against the repo root. Must stay gitignored.
# cache_dir = ".cache/bamzooki"

# The arena folder: everything models produce, kept outside the repo.     BAMZOOKI_ARENA_DIR
#   <arena_dir>/Zook Entries/<full model name>/   designs, challenge progress, results log
#   <arena_dir>/Renders/<full model name>/        contest/trial videos and stills
#   <arena_dir>/Transcripts/<full model name>/    arena runner conversations
# arena_dir = "~/BAMZOOKi Arena"
# render_dir / zoo_dir override the Renders / Zook Entries folders individually.


# The challenge given to models through the MCP server: task text, test-run budget (default 20)
# and the final evaluation. See challenges/default.toml.            BAMZOOKI_CHALLENGE
# challenge = "challenges/default.toml"

# tools/arena.py: OpenRouter models take the challenge in turn (needs OPENROUTER_API_KEY in .env).
# [arena]
# challengers = ["anthropic/claude-sonnet-4.5", "openai/gpt-5", "google/gemini-2.5-pro"]
# challenge = "challenges/short.toml"
# max_turns = 120          # model turns per challenger before the runner stops it
# max_tokens = 4000        # per model reply
# temperature = 0.7
# showtime = true                           # the show (extra model calls); the four below need it
# announcer = "anthropic/claude-haiku-5.5"   # the show's host ("none" for no announcer)
# announcer_style = "ringside"              # ringside, documentary, football, noir, or your own words
# speak = true                              # read the announcer aloud
# voice = "Microsoft Hazel Desktop"         # Windows voice (macOS: a `say -v` name)
