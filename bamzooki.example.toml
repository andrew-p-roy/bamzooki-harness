# Copy to `bamzooki.toml` (gitignored) and edit, or point BAMZOOKI_CONFIG at another file.
# Every path may also be overridden by an environment variable (shown next to each key).
# Leave a key out to use auto-discovery.

# Root of the BAMZOOKi install (contains Bonsai.exe and he.skx).       BAMZOOKI_INSTALL
# install_dir = "C:/Program Files (x86)/BAMZOOKi"

# Per-user save root the engine writes to (Teams/, Contests/, ...).   BAMZOOKI_SAVE_DIR
# Windows default: %APPDATA%/Bamzooki
# save_dir = "C:/Users/me/AppData/Roaming/Bamzooki"

# Command prefix used to launch Bonsai.exe on Linux/macOS.            BAMZOOKI_WINE
# Unset on Windows. Example: ["wine"] or ["env", "WINEPREFIX=/home/me/.wine-bamzooki", "wine"]
# wine_command = ["wine"]

# Where decrypted scripts, decoded Zooks and the install sandbox go.  BAMZOOKI_CACHE_DIR
# Relative paths are resolved against the repo root. Must stay gitignored.
# cache_dir = ".cache/bamzooki"

# The arena folder: everything models produce, kept outside the repo.     BAMZOOKI_ARENA_DIR
#   <arena_dir>/Zook Entries/<full model name>/   designs, challenge progress, results log
#   <arena_dir>/Renders/<full model name>/        contest/trial videos and stills
#   <arena_dir>/Transcripts/<full model name>/    arena runner conversations
# arena_dir = "~/BAMZOOKi Arena"
# render_dir / zoo_dir override the Renders / Zook Entries folders individually.


# tools/arena.py: OpenRouter models take the challenge in turn (needs OPENROUTER_API_KEY in .env).
# The MCP server on its own reads the same [arena] challenge settings.
# [arena]
# challengers = ["anthropic/claude-sonnet-4.5", "openai/gpt-5", "google/gemini-2.5-pro"]
#
# --- The challenge ---
# challenge_rules: "short" or "full" (challenges/<name>.toml) or a path to your own rules file.
#   short: a design phase before EACH knockout round, the limits afresh each time; every model
#          designs round 1's Zook, then only the models still in design the next round's. The rules
#          file's qualifying = "first" (default: round 1's Zook plays a qualifying game, a win gets
#          the model in), "all" (every round's; a later loss forfeits that match) or "none".
#   full:  ONE set of limits shared by all the model's Zooks: a separate Zook for each challenge,
#          one put forward for each, no qualifying.
#   Both: max_qualifiers (default 8) models at most in the knockout; once it's full the rest of the
#   queue isn't called.
# contest / opponent: one element per knockout round (the final last); "" = random (no repeats
#   while there are others). The opponent is a round's qualifying opponent or Zook to beat. The
#   arena checks the queue against the rounds at the start (n models: log2(n) rounds, rounded up):
#   with fewer, rounds are skipped (full: the first ones; short: those after round 1); with more,
#   random ones are added (full: before round 1; short: after it). A field that isn't a power of
#   two gets first-round byes, for the best qualifiers.
# hidden: the models aren't told the contests (short.toml: visible, full.toml: hidden). Hidden: no
#   qualifying. Short: each round's Zook is designed blind and the contest announced once it's in.
#   Full: a team of one Zook per round, shared limits; each knockout round's contest is announced
#   as it starts and each model picks a team Zook for it, each only once.
# Every model MUST put forward one distinctly different Zook per round; in the knockout a model with
#   no Zook for a round (or no team Zook left) forfeits the match.
# challenge_rules = "short"
# contest = ["", "", "Zook Sumo"]
# opponent = ["", "", "Spider"]
# hidden = false
#
# max_turns = 120          # model turns per challenger before the runner stops it
# max_tokens = 4000        # per model reply
# temperature = 0.7
# showtime = true                           # the show (extra model calls); the four below need it
# announcer = "anthropic/claude-haiku-5.5"   # the show's host ("none" for no announcer)
# announcer_style = "ringside"              # ringside, documentary, football, noir, or your own words
# speak = true                              # read the announcer aloud (Kokoro if installed: pip install -e .[voice])
# voice = "bm_george"                       # the announcer: Kokoro's British male (or e.g. "Microsoft Hazel Desktop")
# voice_speed = 1.1                         # Kokoro's pace
# presentation_words = 120                  # with showtime: the length the models are asked to keep their
#                                           # presentation to (a longer one is still read in full)
# commentator = "google/gemini-3.5-flash-lite"  # live commentary on the knockout games (off unless set)
# music = false                             # --nomusic: no music, live or in the videos (the beeps stay);
#                                           # with showtime the design songs play live while models design
# overlay = 8765                            # --overlay: the broadcast overlay page, for an OBS Browser Source
#                                           # (1920x1080): the design ticker, the knockout bracket, a score bug
#
# [arena.obs]                               # --obs (on when this table is here): OBS follows the show
# host = "localhost"                        # (pip install -e .[obs]; the password comes from OBS's own
# port = 4455                               #  settings or OBS_WEBSOCKET_PASSWORD)
# record = true                             # record from the start of the session to the end
# scenes = { design = "Design", showcase = "Showcase", game = "Game", talk = "Knockout", crown = "Crown" }
#
# [arena.voices]                            # --speak: the contestants' own voices, by lab or full model id
# google = "af_heart"                       # Gemini: American female
# qwen = "bf_emma"                          # Qwen: British female
# openai = "am_puck"                        # GPT / Luna: American male
# anthropic = "am_michael"                  # Claude: American male
