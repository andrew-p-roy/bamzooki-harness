# Copy to `bamzooki.toml` (gitignored) and edit, or point BAMZOOKI_CONFIG at another file.
# Every path may also be overridden by an environment variable (shown next to each key).
# Leave a key out to use auto-discovery.

# Root of the BAMZOOKi install (contains Bonsai.exe and he.skx).       BAMZOOKI_INSTALL
# install_dir = "C:/Program Files (x86)/BAMZOOKi"

# Per-user save root the engine writes to (Teams/, Contests/, ...).   BAMZOOKI_SAVE_DIR
# Windows default: %APPDATA%/Bamzooki
# save_dir = "C:/Users/me/AppData/Roaming/Bamzooki"

# Command prefix used to launch Bonsai.exe on Linux/macOS.            BAMZOOKI_WINE
# Unset on Windows. Example: ["wine"] or ["env", "WINEPREFIX=/home/me/.wine-bamzooki", "wine"]
# wine_command = ["wine"]

# Where decrypted scripts, decoded Zooks and the install sandbox go.  BAMZOOKI_CACHE_DIR
# Relative paths are resolved against the repo root. Must stay gitignored.
# cache_dir = ".cache/bamzooki"

# Where MP4 renders go, one folder per model: <render_dir>/<model>/<timestamp>_<contest>_....mp4
# Relative paths are resolved against the repo root. Gitignored by default ("renders/").   BAMZOOKI_RENDER_DIR
# render_dir = "renders"

# Where models' Zook designs are kept: <zoo_dir>/<model>/<Name>/<n>.0.zook (+ .json spec, previews).
# Gitignored by default ("zooks/").                                     BAMZOOKI_ZOO_DIR
# zoo_dir = "zooks"

# The challenge given to models through the MCP server: task text, test-run budget (default 20)
# and the final evaluation. See challenges/default.toml.            BAMZOOKI_CHALLENGE
# challenge = "challenges/default.toml"
