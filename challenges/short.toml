# Short rules: chosen with `challenge_rules = "short"` in bamzooki.toml [arena], which also sets the
# rounds (`contest` and `opponent`, one element per knockout round). Copy this file to make your own
# rules and give its path as challenge_rules.
#
# A design phase before each knockout round, and the limits below apply to EACH phase afresh: every
# model designs round 1's Zook, then after each knockout round only the models still in design the
# next round's. With qualifying, round 1's Zook plays a qualifying game against the round's opponent
# and a win gets the model into the knockout. The challenges are visible by default; hidden, there's
# no qualifying and each round's contest is announced once its Zooks are in. The knockout's rounds
# fit the field: round 1 and the final stay, rounds in between are dropped or added at random.

name = "short"
title = "The short BAMZOOKi challenge"
# music = "synth_funk"                   # one track for every game ("none" = silent); unset, each contest
                                         #   plays its own ([contests] in Music/tracks.toml)
hidden = false                           # the models are told each round's contest and opponent
qualifying = "first"                     # qualifying games: "first" round only, "all" rounds, "none"
                                         #   (all: a later round's lost qualifying game forfeits its match)
max_qualifiers = 8                       # the first 8 to qualify make the knockout (3 rounds); "" = no limit
description = """
Read the rules of each round's contest with get_contest before you design, so you know exactly
what your Zook has to do (how a game is won, lost or drawn).

Tests are unlimited: test_zook is the Zook Kit's Test button (your Zook walks to a target in the
plain BoxEnv test environment). Use it as often as you like, after every design and every tweak,
to see how it moves.

Trials don't use your test runs either: you have up to 5 of them. run_trial plays one of the
Zook Kit's trials for one of your Zooks ("sprint" to check it walks forwards and how fast,
"block_push" to measure pushing power, or free play in an environment such as
"free:StrongEnv"). Use them: try several clearly different designs and bold ideas, compare them
on trials, and refine the best on the evidence.

Design your own Zook: don't copy an example Zook (whole or with small tweaks). Study them for
ideas, then build your own from scratch. save_zook refuses a design that is too close to an
example.

Contests are limited: each test run is exactly ONE run_contest game, with the two Zooks given
as arguments. The opponent can be any example Zook (Spider, Ant, Leapsa, Scrabber,
Twigger, Wormthing) or one of your own earlier designs (e.g. green="MyZook@3", red="MyZook@2").
Choosing which contests to play, against whom, is your testing strategy. Saving and previewing
designs is free too.

Each round you reach, you design a new Zook for it, distinctly different from your earlier ones,
with fresh limits. A qualifying game scores a win 1, a draw 0.5, a loss 0 (it doesn't use a test
run); you need a win. Games aren't
deterministic: the same two Zooks can get a different result each time. A design that only just
wins a practice contest may lose the real one, so make sure it wins clearly and consistently.
"""

[budget]
runs = 3                                 # test runs (contests, one game each) per round; 0 = unlimited
counts = ["run_contest"]                 # tools that use a run
trials = 5                               # run_trial games per round, besides the runs (0 = unlimited)
test = 0                                 # test_zook games: the Zook Kit's Test button (0 = unlimited)
submissions = 1                          # submit_design calls per round
reset_each_round = true                  # a design phase per round, the limits afresh each time

[scoring]
draw = 0.5                               # a game with no winner (e.g. time limit) is worth half a win
time_limit = 120                         # seconds of play after Go, every contest (tests and qualifying)

# The qualifying games. side = the submitted Zook's arena colour. The best qualifiers (score, then
# fewest test runs) get the byes when the knockout's field isn't a power of two.
[evaluation]
seed = ""                                # blank = random, decided at the start of every challenge; never shown
side = "green"
