# Default challenge for a model designing Zooks. Copy this file to make your own and point to it
# with `challenge = "challenges/<file>.toml"` in bamzooki.toml, BAMZOOKI_CHALLENGE, or
# `python -m bamzooki.mcp_server --challenge <file>`.

name = "short"
title = "Beat Spider at Sumo (short test)"
music = "synth_funk"                     # the highlights reel's track (Music/tracks.toml; "none" = silent)
description = """
Design a Zook that beats Spider, the game's best example Zook, at Zook Sumo: push it off the
raised round table (or survive while it falls off) without leaving the table yourself.

Tests are unlimited: test_zook is the Zook Kit's Test button (your Zook walks to a target in the
plain BoxEnv test environment). Use it as often as you like, after every design and every tweak,
to see how it moves.

Trials don't use your test runs either: you have up to 5 of them. run_trial plays one of the
Zook Kit's trials for one of your Zooks ("sprint" to check it walks forwards and how fast,
"block_push" to measure pushing power, or free play in an environment such as
"free:StrongEnv"). Use them: try several clearly different designs and bold ideas, compare them
on trials, and refine the best on the evidence.

Design your own Zook: don't copy an example Zook (whole or with small tweaks). Study them for
ideas, then build your own from scratch.

Contests are limited: each test run is exactly ONE run_contest game, with the two Zooks and the
seed given as arguments. The opponent can be any example Zook (Spider, Ant, Leapsa, Scrabber,
Twigger, Wormthing) or one of your own earlier designs (e.g. green="MyZook@3", red="MyZook@2").
Choosing which contests to play, against whom, is your testing strategy. Saving and previewing
designs is free too.

When you're done, call submit_design once with your best design. It plays the single
evaluation game below (it doesn't use a test run): a win scores 1, a draw 0.5, a loss 0. The
evaluation seed is secret, so make sure your design wins robustly, not just on one seed.
"""

[budget]
runs = 3                                 # test runs (contests, one game each) per model; 0 = unlimited
counts = ["run_contest"]                 # tools that use a run
trials = 5                               # run_trial games, besides the runs (0 = unlimited)
test = 0                                 # test_zook games: the Zook Kit's Test button (0 = unlimited)
submissions = 1                          # how often submit_design may be called

[scoring]
draw = 0.5                               # a game with no winner (e.g. time limit) is worth half a win
time_limit = 120                         # seconds of play after Go, every contest (tests and evaluation)

# The one official game played by submit_design. side = the submitted Zook's arena colour.
[evaluation]
contest = "Zook Sumo"
opponent = "Spider"
seed = 7
side = "green"
reveal_seed = false                      # models know the game but not its seed (can't rehearse it)
