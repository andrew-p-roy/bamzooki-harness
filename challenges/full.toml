# Full rules: chosen with `challenge_rules = "full"` in bamzooki.toml [arena], which also sets the
# rounds (`contest` and `opponent`, one element per knockout round). Copy this file to make your own
# rules and give its path as challenge_rules.
#
# The whole design phase has ONE budget, shared by every Zook the model designs. It designs a
# separate Zook for each round's challenge and, when it's done, puts one forward for each. There is
# no qualifying game: every model that puts Zooks forward is in the knockout (up to max_qualifiers;
# with a field that isn't a power of two, random models get first-round byes). The challenges are
# hidden by default: the model designs a team without knowing the contests, and picks a team Zook
# when each knockout round's contest is announced (each Zook once).

name = "full"
title = "The full BAMZOOKi challenge"
# music = "synth_funk"                   # one track for every game ("none" = silent); unset, each contest
                                         #   plays its own ([contests] in Music/tracks.toml)
hidden = true                            # the rounds' contests are kept from the models (bamzooki.toml can override)
qualifying = "none"                      # no qualifying games (they're for short rules)
max_qualifiers = 8                       # the first 8 to put their Zooks forward make the knockout; "" = no limit
description = """
Read the rules of every contest you may face with get_contest before you design, so you know
exactly what each Zook has to do (how a game is won, lost or drawn).

Tests are unlimited: test_zook is the Zook Kit's Test button (your Zook walks to a target in the
plain BoxEnv test environment). Use it as often as you like, after every design and every tweak,
to see how it moves.

Trials don't use your test runs either: you have up to 50 of them. run_trial plays one of the
Zook Kit's trials for one of your Zooks ("sprint" to check it walks forwards and how fast,
"block_push" to measure pushing power, or free play in an environment such as
"free:StrongEnv"). Use them: try several clearly different designs and bold ideas, compare them
on trials, and refine the best on the evidence.

Design your own Zooks: don't copy an example Zook (whole or with small tweaks). Study them for
ideas, then build your own from scratch. save_zook refuses a design that is too close to an
example.

Contests are limited: each test run is exactly ONE run_contest game, with the two Zooks given
as arguments. The opponent can be any example Zook (Spider, Ant, Leapsa, Scrabber,
Twigger, Wormthing) or one of your own earlier designs (e.g. green="MyZook@3", red="MyZook@2").
Choosing which contests to play, against whom, is your testing strategy. Saving and previewing
designs is free too. Your limits are shared by all your Zooks: plan how you spend them.

Games aren't deterministic: the same two Zooks can get a different result each time. A design
that only just wins a practice contest may lose in the knockout, so make sure it wins clearly
and consistently.
"""

[budget]
runs = 20                                # test runs (contests, one game each) per model; 0 = unlimited
counts = ["run_contest"]                 # tools that use a run
trials = 50                              # run_trial games, besides the runs (0 = unlimited)
test = 0                                 # test_zook games: the Zook Kit's Test button (0 = unlimited)
submissions = 1                          # Zooks put forward per round
reset_each_round = false                 # one budget shared by all the Zooks

[scoring]
draw = 0.5                               # a game with no winner (e.g. time limit) is worth half a win
time_limit = 120                         # seconds of play after Go, every contest (tests and knockout)

[evaluation]
seed = ""                                # blank = random, decided at the start of every challenge; never shown
side = "green"
