# --- Per-challenge options (October 2026): 3 clips per contest, tagged with its name. Made with
# the same opening as above; loop points measured with the tempo searched near the one asked for
# (the analyser's 90-180 folding misread several of these by 4:3 or 2:1).

# Designing: three full-length chill songs (~3 min), played one after another, round and round,
# through the design phases (trials and practice games included; a qualifying game has its contest's
# track instead). Made with Lyria 3 Pro (google/lyria-3-pro-preview, $0.08 a song). Each fades in and
# out gently, so each song plays whole. Each prompt started with:
#   "Instrumental only, absolutely no vocals, no humming, no choir and no spoken words. A long, very chill piece of about three minutes, to play quietly in the background while inventors design robot creatures in a workshop: steady and unobtrusive all the way through, a gentle start and a gentle ending, no sudden loud parts and no big drops."

[tracks.design_berlin_school]
file = "design_berlin_school.mp3"
prompt = "Slow 1970s Berlin-school electronic music made only with vintage analogue synthesizers: a hypnotic, softly pulsing sequencer pattern that evolves very slowly as its filter opens and closes, warm Mellotron-style string and choir-free pad chords, deep drifting bass drones, a long, singing analogue lead melody floating over the top, wide spacey reverb and gentle tape echo, no drums, the sequence pulsing at about 90 BPM, meditative, cosmic and dreamy."
bpm = 90.1
loop_start = 0.0  # the whole song: 170.37 s, fading in and out
tags = ["design", "chill", "analogue", "ambient"]

