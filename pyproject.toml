[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bamzooki-harness"
version = "0.0.1"
description = "Let AI models design BAMZOOKi Zooks and test them in the real Bonsai engine (bring your own install)."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "cryptography>=42",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pre-commit>=3",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = [
    "install: needs a configured BAMZOOKi install (skipped otherwise)",
]
